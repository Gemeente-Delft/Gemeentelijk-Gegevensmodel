# Taskfile for automating the GGM deployment process
#
# This Taskfile defines tasks for:
# - Validating tools and variables
# - Importing the XMI file into Crunch UML
# - Generating Excel specifications, Markdown documentation, and translations
# - Deploying documentation to GitHub Pages
#
# Usage:
# - Run `task --list` to see all available tasks.
# - Run `task <taskname>` to execute a specific task.
#
# Environment:
# - A `.env` file is used to load configuration variables like `VERSION`.
# - Ensure required tools are installed before running (`task prepare:check-tools`).
#
# Examples:
# - To perform a full deployment: `task full-deploy`
# - To generate translations: `task generate:translations`
# - To generate excel-file: `task generate:excel`
# - To generate documentation: `task generate:docs`
# - To publish documentation to GitHub Pages: `task publish:github`
# - To generate the LOD sub-models (one Turtle per EA diagram) plus the ontology and SHACL shapes: `task generate:lod-views`
# - To publish the LOD sub-models (one graph per diagram) to the LOD server: `task publish:lod`
# - To merge the LOD sub-models into one downloadable Turtle file: `task generate:lod-views-merged`
#
# Author: Arjen Brienen
# Last Updated: 29 oktober 2026
version: '3'

dotenv: ['.env']

vars:
  VERSION_DIR: "./{{.VERSION}}"
  PREVIOUS_VERSION_DIR: "./{{.PREVIOUS_VERSION}}"
  XMI: "{{.VERSION_DIR}}/{{.XMI_FILE}}"
  PREVIOUS_XMI: "{{.PREVIOUS_VERSION_DIR}}/{{.XMI_FILE}}"
  GGM: "{{.VERSION_DIR}}/{{.GGM_FILE}}"
  EXCEL: "{{.VERSION_DIR}}/{{.EXCEL_FILE}}"
  LOD: "{{.VERSION_DIR}}/{{.LOD_FILE}}"
  MIM: "{{.VERSION_DIR}}/{{.GGM_MIM_FILE}}"
  TRANSLATIONS_DIR: "{{.VERSION_DIR}}/{{.TRANSLATIONS_DIR}}"
  i18N_FILE: "{{.TRANSLATIONS_DIR}}/{{.i18N_FILE}}"
  GGM_ROOT_SCHEMA: "GGM_ROOT_SCHEMA"
  GGM_PREVIOUS_SCHEMA_RAW: "GGM_PREVIOUS_SCHEMA_RAW"
  GGM_PREVIOUS_SCHEMA: "GGM_PREVIOUS_SCHEMA"
  CRUNCH_UML_DB: "./crunch_uml.db"
  # crunch_uml draait in een eigen venv (eigen site-packages) in plaats van de homebrew-python,
  # zodat een 'brew upgrade python' de pipeline niet breekt en de versie per release vastligt.
  # 0.8.0 is de eerste uitgebrachte versie met de herziene Linked Data-renderer (IRI's zonder
  # spaties, generalisaties in de juiste richting, unieke property-IRI's, technische packages
  # uitgesloten) en de MIM 1.2-laag (mim:-typering, metagegevens, kardinaliteit, taaltags).
  # Oudere versies (t/m 0.7.0) leveren een LOD-export met de bekende gebreken; niet terugzetten.
  # 0.8.1 voegt de deelmodellen per diagram (--lod_views_dir), de losse SHACL-shapes
  # (--lod_shapes_file) en IRI's langs de pakketboom toe; generate:lod-views vereist die versie.
  # Zie taak prepare:venv-crunch.
  CRUNCH_UML_VERSION: "0.8.1"
  CRUNCH_VENV: "tools/.venv-crunch"
  CRUNCH: "tools/.venv-crunch/bin/crunch_uml"
  # Metagegevens van het informatiemodel in de Linked Data-export (MIM 1.2: mim:Informatiemodel
  # op de basis-URI met dcterms:title/publisher/license; owl:versionInfo komt uit VERSION).
  LOD_TITLE: "Gemeentelijk Gegevensmodel"
  LOD_PUBLISHER: "https://www.delft.nl/"
  LOD_LICENSE: "https://github.com/Gemeente-Delft/Gemeentelijk-Gegevensmodel/blob/master/LICENSE"
  LOD_INFORMATIEDOMEIN: "Gemeentelijke overheid"
  # Technische EA-packages die niet in de Linked Data horen (met subpackages; patronen, hoofdletterongevoelig).
  LOD_EXCLUDE_PACKAGES: "Diagram,Diagrammen intern gebruik,Tekenwijze,View*"
  # De SHACL-shapes van de Linked Data-export apart van de ontologie (crunch_uml --lod_shapes_file):
  # de ontologie ({{.LOD}}) bevat dan alleen RDFS/OWL met de MIM-metagegevens, de shapes importeren
  # de ontologie met owl:imports. Samen valideren: python tools/validate_mim_lod.py ontologie shapes.
  LOD_SHAPES: "{{.VERSION_DIR}}/Gemeentelijk Gegevensmodel Linked Data-shapes.ttl"
  # Deelmodellen (views): één Turtle-bestand per EA-diagram in <release>/ttl, elk met als eerste
  # regel '# graph: <LINKED_DATA_NS/<versie>/pad>', gegenereerd door crunch_uml (generate:lod-views,
  # vereist crunch_uml met --lod_views_dir; vóór 29 oktober 2026 door de generator van Ashkan).
  # Het pad volgt de EA-pakketboom zonder volgnummers en zonder het package 'Diagram':
  # 99 Kern > Model BAG > Diagram > Onderzoek -> kern/bag/onderzoek. publish:lod zet ze als
  # graphs onder <LINKED_DATA_NS>/<LOD_VIEWS_PREFIX>/<pad> op de server;
  # generate:lod-views-merged voegt ze samen tot één bestand in dezelfde map, dat in git staat
  # zodat het geheel te downloaden is. Overschrijfbaar op de commandline (task ... VAR=waarde).
  LOD_VIEWS_SRC: "{{.VERSION_DIR}}/ttl"
  LOD_VIEWS_PREFIX: "{{.VERSION}}"
  LOD_VIEWS_MERGED: "{{.LOD_VIEWS_SRC}}/ggm-geheel-{{.VERSION}}.ttl"
  # Diagrammen (en packages waar ze onder vallen) die geen deelmodel worden: de RSGB/RGBZ-catalogi,
  # interne en tekentechnische diagrammen en het GML3-pakket. Patronen, hoofdletterongevoelig;
  # vervangt de standaardlijst van crunch_uml (dus 'View*' hier niet: de views Betrokkene en
  # (Zaak)objecten van RGBZPlus horen er wél bij).
  LOD_VIEWS_EXCLUDE: "Abstracte en concrete objecttypen,Catalogus RGBZ,Catalogus RSGB,Referentielijsten,Relatieklassen,Diagrammen intern gebruik,Tekentechnische relaties,Dimensies,Metagegevens,Model RGBZ,Model Kern RGBZ,RSGB Model,Diagram RSGB,GML3"
  DOCS: "./docs"
  DEFS: "./docs/definities"
  PUBLISH: "false"
  ROOT_GGM: "{{.ROOT_NODE_GGM}}"
  CHANGES_MD: "{{.VERSION_DIR}}/{{.CHANGES_MD_FILE}}"

tasks:
  # ==========================================================================
  # Prepare — Voorwaarden valideren
  # ==========================================================================
  prepare:check-tools:
    desc: "Check for pre conditions. Verify required tools are installed."
    cmds:
      - |
        # Lijst van vereiste tools en hun download-URLs.
        # crunch_uml staat hier NIET in: dat draait in een eigen venv (prepare:venv-crunch).
        declare -A tools=(
          ["mkdocs"]="https://www.mkdocs.org"
          ["mike"]="https://github.com/jimporter/mike"
          ["jq"]="https://stedolan.github.io/jq"
        )

        # Controleer of tools geïnstalleerd zijn
        missing_tools=()
        for tool in "${!tools[@]}"; do
          if ! command -v $tool &> /dev/null; then
            missing_tools+=($tool)
          fi
        done

        # Meld ontbrekende tools en geef installatie-instructies
        if [ ${#missing_tools[@]} -ne 0 ]; then
          echo "Error: The following tools are not installed:"
          for tool in "${missing_tools[@]}"; do
            echo "- $tool: ${tools[$tool]}"
          done
          echo "Please install the missing tools and try again."
          exit 1
        else
          echo "All required tools are installed."
        fi
    shell: bash

  prepare:check-vars:
    desc: "Check for pre conditions. Validate required variables VERSION and check if VERSION_DIR exist."
    cmds:
      - |
        # Valideer invoerparameters
        echo "Validating input parameter {{.VERSION}} ..."
      - |
        if [ -z "{{.VERSION}}" ]; then
          echo "Error: VERSION cannot be empty."
          exit 1
        fi
        if [[ ! "{{.VERSION}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Error: Invalid VERSION format. Use v{number}.{number}, e.g., v1.0"
          exit 1
        fi
        if [ ! -d "{{.VERSION_DIR}}" ]; then
          echo "Error: Directory '{{.VERSION_DIR}}' does not exist."
          exit 1
        fi
      - |
        # Valideer invoerparameters
        echo "VERSION {{.VERSION}} and Versiondir {{.VERSION_DIR}} are valid..."
    shell: bash

  prepare:venv-crunch:
    desc: "Zorg voor een geïsoleerde venv met crunch_uml {{.CRUNCH_UML_VERSION}}, ongevoelig voor brew-python-upgrades."
    cmds:
      - |
        # crunch_uml draait in een eigen venv ({{.CRUNCH_VENV}}) met eigen site-packages. De venv
        # wordt (her)opgebouwd zodra hij ontbreekt, stuk is (bv. na een python-upgrade) of een
        # andere crunch_uml-versie bevat dan CRUNCH_UML_VERSION, zodat een versiewissel in deze
        # TaskFile altijd doorwerkt. crunch_uml vereist Python 3.10 t/m 3.13 (gepinde lxml-wheels).
        VENV="{{.CRUNCH_VENV}}"; : "${VENV:?CRUNCH_VENV is leeg}"
        WANT="{{.CRUNCH_UML_VERSION}}"
        if ! "$VENV/bin/python" -c "import importlib.metadata as m, sys; sys.exit(0 if m.version('crunch_uml') == '$WANT' else 1)" >/dev/null 2>&1; then
          echo "Aanmaken/herstellen crunch_uml-venv in $VENV (crunch_uml==$WANT)..."
          rm -rf "$VENV"
          PY=""
          for c in python3.11 python3.12 python3.13; do
            if command -v "$c" >/dev/null 2>&1; then PY="$c"; break; fi
          done
          if [ -z "$PY" ]; then
            echo "Error: geen python3.11, python3.12 of python3.13 gevonden (bv. 'brew install python@3.12')."
            exit 1
          fi
          "$PY" -m venv "$VENV"
          "$VENV/bin/python" -m pip install --quiet --upgrade pip
          "$VENV/bin/python" -m pip install --quiet "crunch_uml==$WANT"
          echo "crunch_uml-venv klaar ($("$VENV/bin/python" --version), crunch_uml $WANT)."
        fi
    shell: bash

  # ==========================================================================
  # Import — Model(len) inladen in Crunch UML
  # ==========================================================================
  import:model:
    desc: "Import the XMI file into Crunch UML Database."
    deps: [prepare:check-tools, prepare:check-vars, prepare:venv-crunch]
    cmds:
      - |
        if [ ! -f "{{.XMI}}" ]; then
          echo "Error: XMI file '{{.XMI}}' does not exist."
          exit 1
        fi
      - echo "Importing XMI file '{{.XMI}}' into Crunch UML..."
      - '{{.CRUNCH}} import -f "{{.XMI}}" -t eaxmi -db_create'
      - echo "Copying Core GGM Model to {{.GGM_ROOT_SCHEMA}}..."
      - '{{.CRUNCH}} transform -ttp copy -sch_to "{{.GGM_ROOT_SCHEMA}}" -rt_pkg "{{.ROOT_GGM}}"'
      - echo "Crunch database successfully created and setup..."
    shell: bash
    sources:
      - "{{.XMI}}"
    generates:
      - "{{.CRUNCH_UML_DB}}"
    run: when_changed

  import:previous:
    desc: "Import the XMI file of previous version {{.PREVIOUS_VERSION}} into Crunch UML Database."
    deps: [import:model]
    cmds:
      - |
        if [ ! -f "{{.PREVIOUS_XMI}}" ]; then
          echo "Error: XMI file '{{.PREVIOUS_XMI}}' does not exist."
          exit 1
        fi
      - echo "Importing XMI file '{{.PREVIOUS_XMI}}' into Crunch UML schema {{.GGM_PREVIOUS_SCHEMA_RAW}}..."
      - '{{.CRUNCH}} -sch {{.GGM_PREVIOUS_SCHEMA_RAW}} import -f "{{.PREVIOUS_XMI}}" -t eaxmi'
      - echo "Copying {{.GGM_PREVIOUS_SCHEMA_RAW}} GGM Model to {{.GGM_PREVIOUS_SCHEMA}}..."
      - '{{.CRUNCH}} transform -ttp copy -sch_from "{{.GGM_PREVIOUS_SCHEMA_RAW}}" -sch_to "{{.GGM_PREVIOUS_SCHEMA}}" -rt_pkg "{{.ROOT_GGM}}"'
      - echo "Successfully added previous schema to Crunch database successfully created and setup..."
    shell: bash
    sources:
      - "{{.PREVIOUS_XMI}}"
      - "{{.XMI}}"
    generates:
      - "{{.CRUNCH_UML_DB}}"
    run: when_changed

  # ==========================================================================
  # Generate — Artifacts genereren uit het model
  # ==========================================================================
  generate:docs:
    desc: "Generate Markdown documentation from the model."
    deps: [import:model]
    cmds:
      - echo "Generating Markdown documentation..."
      - mkdir -p "{{.DEFS}}"
      - rm -rf "{{.DEFS}}"/*.md
      - '{{.CRUNCH}} -sch "{{.GGM_ROOT_SCHEMA}}" export -t jinja2 --output_jinja2_template ggm_markdown.j2 -f "{{.DEFS}}/definitie.md" --output_jinja2_templatedir ./tools/'
      - |
        # Vervang de versies in de uitwisselspecificatie-templates
        # Loop door alle .template-bestanden in de directory en submappen
        echo "Processing template files in {{.DOCS}} ..."
        for file in $(find "{{.DOCS}}" -type f -name "*.template"); do
          # Bepaal de doelbestandnaam door ".template" te verwijderen
          output_file="${file%.template}"

          # Gebruik sed om de placeholder ###VERSION### te vervangen door de versie
          sed "s/###VERSION###/{{.VERSION}}/g" "$file" > "$output_file"

          # Geef een bericht over de verwerking
          echo "Processed $file -> $output_file"
        done
    shell: bash

  generate:translations:
    desc: "Generate translations for all in the i18n file defined languages. Using '{{.i18N_FILE}}'"
    deps: [import:model]
    cmds:
      - |
        if [ ! -f "{{.i18N_FILE}}" ]; then
          echo "Error: i18n file '{{.i18N_FILE}}' does not exist."
          exit 1
        fi

        LANGUAGES=$(jq -r 'keys[]' "{{.i18N_FILE}}")
        if [ -z "$LANGUAGES" ]; then
          echo "Error: No languages found in '{{.i18N_FILE}}'."
          exit 1
        fi

        # SPLIT GGM FILENAME
        GGM="{{.GGM}}"
        BASENAME=$(basename "$GGM")  # Extract de bestandsnaam
        FILENAME="${BASENAME%.*}"    # Extract de bestandsnaam zonder extensie

        echo "Languages: $LANGUAGES"
        mkdir -p "{{.TRANSLATIONS_DIR}}"
        for LANG in $LANGUAGES; do
          TRANSLATION_SCHEMA="translation_$LANG"
          echo "Processing language: $LANG..."
          {{.CRUNCH}} transform -ttp copy -sch_to $TRANSLATION_SCHEMA --root_package "{{.ROOT_GGM}}"
          {{.CRUNCH}} -sch $TRANSLATION_SCHEMA import -f "{{.i18N_FILE}}" -t i18n --language $LANG
          TRANSLATION_FILE="{{.TRANSLATIONS_DIR}}/${FILENAME}_${LANG}.qea"
          cp -f "{{.GGM}}" "$TRANSLATION_FILE"
          {{.CRUNCH}} -sch $TRANSLATION_SCHEMA export -f "$TRANSLATION_FILE" -t earepo --tag_strategy update
        done
    shell: bash
    sources:
      - "{{.CRUNCH_UML_DB}}"
      - "{{.i18N_FILE}}"
    generates:
     - "{{.TRANSLATIONS_DIR}}/*.qea"

  generate:excel:
    desc: "Generate the Excel specification from the model. Generating '{{.EXCEL}}'"
    deps: [import:model]
    cmds:
      - echo "Generating Excel specification..."
      - '{{.CRUNCH}} -sch "{{.GGM_ROOT_SCHEMA}}" export -t xlsx -f "{{.EXCEL}}"'
    shell: bash

  generate:lod:
    desc: "Generate the Linked Data specification (Turtle met MIM 1.2-laag) from the model: ontologie '{{.LOD}}' en SHACL-shapes '{{.LOD_SHAPES}}'"
    deps: [import:model]
    cmds:
      - echo "Generating Lod specification..."
      # Eén shell-regel (gevouwen YAML). Opties: technische packages weglaten (-xpn), Nederlandse
      # taaltags op labels/definities/toelichtingen, de GGM-versie als owl:versionInfo/versionIRI,
      # de MIM 1.2-metagegevens van het informatiemodel en de SHACL-shapes in een eigen bestand.
      # Zie docs/handleiding/export.md van crunch_uml.
      - >-
        {{.CRUNCH}} -sch "{{.GGM_ROOT_SCHEMA}}" export -t ttl -f "{{.LOD}}"
        --linked_data_namespace {{.LINKED_DATA_NS}}
        --output_exclude_package_names "{{.LOD_EXCLUDE_PACKAGES}}"
        --lod_language nl
        --lod_version {{.VERSION}}
        --lod_title "{{.LOD_TITLE}}"
        --lod_publisher {{.LOD_PUBLISHER}}
        --lod_license {{.LOD_LICENSE}}
        --lod_informatiedomein "{{.LOD_INFORMATIEDOMEIN}}"
        --lod_informatiemodeltype logisch
        --lod_shapes_file "{{.LOD_SHAPES}}"
    shell: bash

  generate:lod-views:
    desc: "Genereer de deelmodellen (één Turtle per EA-diagram) in '{{.LOD_VIEWS_SRC}}', samen met de ontologie '{{.LOD}}' en de SHACL-shapes '{{.LOD_SHAPES}}', en voeg ze samen tot '{{.LOD_VIEWS_MERGED}}'."
    deps: [import:model]
    cmds:
      - echo "Generating Linked Data views (deelmodellen per diagram)..."
      # 1. Oude deelmodellen opruimen: crunch_uml overschrijft bestanden maar ruimt verdwenen of
      #    hernoemde diagrammen niet op. Het samengevoegde bestand blijft staan (wordt in stap 3
      #    opnieuw geschreven).
      - |
        set -euo pipefail
        SRC="{{.LOD_VIEWS_SRC}}"; MERGED="$(basename "{{.LOD_VIEWS_MERGED}}")"
        mkdir -p "$SRC"
        find "$SRC" -mindepth 1 -name '*.ttl' ! -name "$MERGED" -delete
        find "$SRC" -mindepth 1 -type d -empty -delete
      # 2. Eén export: ontologie + shapes (zoals generate:lod) én per diagram een view in
      #    LOD_VIEWS_SRC/<pad>.ttl met als eerste regel '# graph: <LINKED_DATA_NS/VERSION/pad>'.
      #    Een view is een deelgraaf van de ontologie (dezelfde IRI's, zonder SHACL): de klassen en
      #    enumeraties op het diagram met al hun attributen, en de relaties en generalisaties
      #    tussen die elementen. Zie docs/handleiding/export.md van crunch_uml.
      - >-
        {{.CRUNCH}} -sch "{{.GGM_ROOT_SCHEMA}}" export -t ttl -f "{{.LOD}}"
        --linked_data_namespace {{.LINKED_DATA_NS}}
        --output_exclude_package_names "{{.LOD_EXCLUDE_PACKAGES}}"
        --lod_language nl
        --lod_version {{.VERSION}}
        --lod_title "{{.LOD_TITLE}}"
        --lod_publisher {{.LOD_PUBLISHER}}
        --lod_license {{.LOD_LICENSE}}
        --lod_informatiedomein "{{.LOD_INFORMATIEDOMEIN}}"
        --lod_informatiemodeltype logisch
        --lod_shapes_file "{{.LOD_SHAPES}}"
        --lod_views_dir "{{.LOD_VIEWS_SRC}}"
        --lod_views_exclude "{{.LOD_VIEWS_EXCLUDE}}"
      # 3. Controleren (kopregel, uniek pad, geldige Turtle) en samenvoegen tot het downloadbestand.
      - task: generate:lod-views-merged
    shell: bash

  generate:lod-views-merged:
    desc: "Voeg de deelmodellen uit '{{.LOD_VIEWS_SRC}}' samen tot één Turtle-bestand '{{.LOD_VIEWS_MERGED}}' (om te committen en te downloaden)."
    deps: [prepare:check-vars, prepare:venv-crunch]
    cmds:
      # Zelfde controles als publish:lod (kopregel, uniek graph-pad, geldige Turtle). De uitvoer
      # is deterministisch: ongewijzigde deelmodellen geven een byte-gelijk bestand en dus geen
      # git-diff. publish:lod werkt het bestand ook bij.
      - >-
        "{{.CRUNCH_VENV}}/bin/python" tools/stage_lod_views.py "{{.LOD_VIEWS_SRC}}"
        --namespace "{{.LINKED_DATA_NS}}" --prefix "{{.LOD_VIEWS_PREFIX}}"
        --merged "{{.LOD_VIEWS_MERGED}}"
    shell: bash

  generate:mim:
    desc: "Generate MIM Version from model to repository {{.MIM}}."
    deps: [import:model]
    cmds:
      - echo "Generating MIM version in repo "{{.MIM}}"..."
      - '{{.CRUNCH}} -sch "{{.GGM_ROOT_SCHEMA}}" export -t eamimrepo -f "{{.MIM}}" --tag_strategy upsert'
    shell: bash

  generate:diff:
    desc: "Generate Changes to previous version {{.PREVIOUS_VERSION}} in Markdown file {{.CHANGES_MD}}."
    deps: [import:model, import:previous]
    cmds:
      - echo "Generating changes between version {{.PREVIOUS_VERSION}} and {{.VERSION}} in file {{.CHANGES_MD}}..."
      - '{{.CRUNCH}} -sch "{{.GGM_PREVIOUS_SCHEMA}}" export -t diff_md -f "{{.CHANGES_MD}}" --compare_schema_name "{{.GGM_ROOT_SCHEMA}}" --compare_title "Changes from {{.PREVIOUS_VERSION}} to {{.VERSION}}"'
    shell: bash

  generate:gemma:
    desc: "Generate the Excel specification from the model. Generating '{{.EXCEL}}'"
    deps: [import:model]
    cmds:
      - mkdir -p "{{.GEMMA_DIR}}"
      - echo "Generating CSV's for upload in GEMMA..."
      - >-
        {{.CRUNCH}} -sch "{{.GGM_ROOT_SCHEMA}}" export -t csv -f "{{.GEMMA_DIR}}/{{.GEMMA_FILE_PREFIX}}" --mapper '{{.GEMMA_CLASS_MAPPER}}' --entity_name classes
      - >-
        {{.CRUNCH}} -sch "{{.GGM_ROOT_SCHEMA}}" export -t csv -f "{{.GEMMA_DIR}}/{{.GEMMA_FILE_PREFIX}}" --mapper '{{.GEMMA_CLASS_MAPPER}}' --entity_name associations
      - >-
        {{.CRUNCH}} -sch "{{.GGM_ROOT_SCHEMA}}" export -t csv -f "{{.GEMMA_DIR}}/{{.GEMMA_FILE_PREFIX}}" --mapper '{{.GEMMA_CLASS_MAPPER}}' --entity_name packages
      - echo "Generation ready."
    shell: bash

  # ==========================================================================
  # Publish — Documentatie publiceren
  # ==========================================================================
  publish:local:
    desc: "Build and deploy the documentation using MkDocs and Mike."
    deps: [generate:docs]
    cmds:
      - echo "Building and deploying MkDocs and Mike..."
      - mkdocs build --clean
      - mike deploy "{{.VERSION}}" latest --update-aliases
      - mike set-default "{{.VERSION}}"
      - echo "Documentation deployed. Use 'mike serve' to view results..."
    shell: bash

  publish:github:
    desc: "Publish the documentation directly to GitHub Pages."
    deps: [publish:local]
    prompt:
     - Dit commando publiceert de documentatie direct naar de LIVE GitHub pages. Doorgaan?
     - Weet je het zeker?
    cmds:
      - echo 'Deploying to GitHub Pages...'
      - git push origin gh-pages

  publish:test:
    desc: "Publish the documentation to test location on host {{.FTP_HOST}}"
    deps: [publish:local]
    cmds:
      - echo 'Deploying to test location...'
      - lftp -e "set ssl:verify-certificate no; cd {{.FTP_REMOTE_DIR}}; mirror -R --delete --verbose ./{{.FTP_LOCAL_DIR}} .; bye" {{.FTP_HOST}}
    shell: bash

  # --------------------------------------------------------------------------
  # UITGESCHAKELD (28 oktober 2026): de oude publish:lod rsyncte de volledige crunch_uml-export
  # ({{.LOD}}) als één graph <LINKED_DATA_NS>/ggm-<versie>. Vervangen door publish:lod
  # hieronder (de deelmodellen per diagram). generate:lod maakt de volledige export nog wel.
  # Let op: op de server blijven ggm-<versie>.ttl in de dropmap en de graph in Virtuoso staan
  # tot ze daar worden weggehaald (bestand verwijderen + SPARQL CLEAR GRAPH via isql).
  # --------------------------------------------------------------------------
  # publish:lod:
  #   desc: "Rsync de LOD-export van {{.VERSION}} naar de dropmap van de lod-browser-stack; de loader daar herlaadt de named graph binnen ~30 s."
  #   deps: [prepare:check-vars]
  #   vars:
  #     # Defaults; overschrijf desgewenst in .env. SSH_HOST is een ssh-config-profiel (user arjen,
  #     # eigen sleutel) voor de server 51.158.201.157 (lod.gemeentelijkgegevensmodel.nl).
  #     SSH_HOST: '{{.SSH_HOST | default "lod-ggm"}}'
  #     LOD_DROP: '{{.LOD_DROP | default "/home/gemeentelijkgegevensmodel-lod/ggm-lod"}}'
  #   prompt:
  #     - "rsync de LOD-TTL van {{.VERSION}} naar '{{.SSH_HOST}}:{{.LOD_DROP}}/ggm-{{.VERSION}}.ttl'. Het bestand daar wordt overschreven en de loader herlaadt de graph {{.LINKED_DATA_NS}}/ggm-{{.VERSION}} (alle IRI's van die versie gaan mee). Doorgaan?"
  #   cmds:
  #     - |
  #       set -euo pipefail
  #       if [ ! -f "{{.LOD}}" ]; then
  #         echo "Error: LOD-bestand '{{.LOD}}' bestaat niet. Draai eerst: task generate:lod VERSION={{.VERSION}}"
  #         exit 1
  #       fi
  #       DROP="{{.LOD_DROP}}"
  #       DEST="${DROP%/}/ggm-{{.VERSION}}.ttl"
  #       # De stack (github.com/AshkanA/lod-browser, docker compose achter CloudPanel) bewaakt de
  #       # dropmap: elke *.ttl wordt als named graph <LINKED_DATA_NS>/<bestandsnaam zonder .ttl>
  #       # geladen (CLEAR GRAPH + herladen zodra de md5 van het bestand wijzigt; poll elke 30 s).
  #       # Er is geen laadscript meer op de server: het bestand neerzetten volstaat.
  #       # Rechten 644: de loader-container leest als een andere gebruiker. macOS openrsync kent
  #       # --chmod=F644 niet, de symbolische vorm wel; GNU rsync op de server past 'm toe.
  #       echo "publish:lod: rsync '{{.LOD}}' -> {{.SSH_HOST}}:$DEST"
  #       rsync -az --chmod=Fu=rw,Fgo=r "{{.LOD}}" "{{.SSH_HOST}}:$DEST"
  #       echo "publish:lod: klaar; de loader laadt ggm-{{.VERSION}} binnen ~30 s. Controleer met: task publish:lod-list"
  #   shell: bash

  publish:lod:
    desc: "Rsync de deelmodellen (één TTL per diagram uit {{.LOD_VIEWS_SRC}}) als named graphs onder {{.LINKED_DATA_NS}}/{{.LOD_VIEWS_PREFIX}}/ naar de dropmap van de lod-browser-stack en werk '{{.LOD_VIEWS_MERGED}}' bij."
    deps: [prepare:check-vars, prepare:venv-crunch]
    vars:
      # Defaults; overschrijf desgewenst in .env. SSH_HOST is een ssh-config-profiel (user arjen,
      # eigen sleutel) voor de server 51.158.201.157 (lod.gemeentelijkgegevensmodel.nl).
      SSH_HOST: '{{.SSH_HOST | default "lod-ggm"}}'
      LOD_DROP: '{{.LOD_DROP | default "/home/gemeentelijkgegevensmodel-lod/ggm-lod"}}'
      # DRY_RUN=true: wel controleren en samenvoegen, rsync alleen tonen (-n --itemize-changes).
      DRY_RUN: '{{.DRY_RUN | default "false"}}'
    prompt:
      - "rsync de deelmodellen uit '{{.LOD_VIEWS_SRC}}' naar '{{.SSH_HOST}}:{{.LOD_DROP}}/{{.LOD_VIEWS_PREFIX}}/' (met --delete binnen die map; de rest van de dropmap blijft staan) en werk '{{.LOD_VIEWS_MERGED}}' bij. De loader laadt elk bestand als graph {{.LINKED_DATA_NS}}/{{.LOD_VIEWS_PREFIX}}/<pad> en herlaadt gewijzigde graphs binnen ~30 s. Doorgaan?"
    cmds:
      - |
        set -euo pipefail
        SRC="{{.LOD_VIEWS_SRC}}"; NS="{{.LINKED_DATA_NS}}"
        PREFIX="{{.LOD_VIEWS_PREFIX}}"; PREFIX="${PREFIX#/}"; PREFIX="${PREFIX%/}"
        DROP="{{.LOD_DROP}}"; DEST="${DROP%/}/${PREFIX:+$PREFIX/}"
        STAGE="$(mktemp -d "${TMPDIR:-/tmp}/lod-views.XXXXXX")"; trap 'rm -rf "$STAGE"' EXIT
        chmod 755 "$STAGE"  # mktemp maakt 700 en rsync -a neemt dat over als rechten van <dropmap>/<prefix>/
        # 1. Controleren, klaarzetten en samenvoegen (tools/stage_lod_views.py, rdflib uit de
        #    crunch-venv). De loader op de server leest de kopregel '# graph: <...>' NIET: hij
        #    leidt de graph-URI af uit het relatieve pad in de dropmap (GRAPH_BASE + pad zonder
        #    .ttl). De dropmap moet dus de graph-URI's volgen, niet de EA-packagestructuur van de
        #    bronmap (3_Economie/Diagram/kvk.ttl -> v3.0.0/economie/kvk.ttl). Het script zet per
        #    TTL het bestand op <STAGE>/<pad>.ttl, herschrijft de kopregel naar de graph die het
        #    op de server wordt (<NS>/<prefix>/<pad>) en parset alles vooraf, zodat een kapot
        #    bestand hier faalt en niet elke ronde opnieuw bij de loader. Daarnaast schrijft het
        #    het samengevoegde bestand LOD_VIEWS_MERGED (zie generate:lod-views-merged); dat gaat
        #    niet naar de server en wordt niet als deelmodel meegelezen.
        #    Bewust een script en geen shell-lus: Task draait cmds in zijn eigen Go-shell
        #    (mvdan/sh), waarin een while-read-lus en < <(...) blijven hangen.
        "{{.CRUNCH_VENV}}/bin/python" tools/stage_lod_views.py "$SRC" --namespace "$NS" --prefix "$PREFIX" \
          --stage "$STAGE" --merged "{{.LOD_VIEWS_MERGED}}"
        # 2. Rsync van de boom naar <dropmap>/<prefix>/. --delete werkt alleen binnen die map:
        #    verdwenen deelmodellen gaan daar weg, de rest van de dropmap blijft staan.
        #    Een verwijderd bestand haalt de loader NIET uit Virtuoso; die graph wissen is
        #    (nog) handwerk, zie publish:lod-list. Rechten: bestanden 644, mappen 755 (de
        #    loader-container leest als een andere gebruiker). macOS openrsync kent --chmod=F644
        #    niet, de symbolische vorm wel; voor mappen past openrsync --chmod NIET toe, daarom
        #    zet het script (en de chmod hierboven) de rechten al in de staging en neemt -a ze over.
        #    -c: vergelijken op inhoud. De staging heeft elke run nieuwe bestandsdatums; zonder -c
        #    gaan alle bestanden opnieuw over, met -c alleen de gewijzigde (in DRY_RUN: regels die
        #    met '<f' beginnen; '.f..t' is alleen een nieuwe datum).
        OPTS=(-azc --delete --exclude='/*.ttl' --exclude='/*.graph' --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r)
        if [ "{{.DRY_RUN}}" = "true" ]; then
          OPTS+=(-n --itemize-changes); echo "publish:lod: DRY RUN, er wordt niets verstuurd"
        fi
        echo "publish:lod: rsync $STAGE/ -> {{.SSH_HOST}}:$DEST"
        rsync "${OPTS[@]}" "$STAGE/" "{{.SSH_HOST}}:$DEST"
        echo "publish:lod: klaar; de loader laadt gewijzigde graphs binnen ~30 s. Controleer met: task publish:lod-list"
    shell: bash

  publish:lod-list:
    desc: "Toon welke named graphs nu in de LIVE Virtuoso staan (via SSH, read-only)."
    cmds:
      - |
        set -euo pipefail
        : "${SSH_HOST:?Zet SSH_HOST in .env}"
        PORT="${LOD_LOCAL_PORT:-8080}"
        ssh "$SSH_HOST" "curl -fsS -H 'Accept: text/csv' --data-urlencode 'query=SELECT ?g (COUNT(*) AS ?triples) WHERE { GRAPH ?g { ?s ?p ?o } } GROUP BY ?g ORDER BY ?g' 'http://127.0.0.1:${PORT}/sparql'"
    shell: bash

  # ==========================================================================
  # Orchestratie
  # ==========================================================================
  full-deploy:
    desc: "Execute the entire deployment process, inclusief i18n-hervertaling via Ollama."
    cmds:
      - task: generate:excel
      - |
        echo ""
        echo "=== Vertalingen genereren via lokale Ollama ==="
        echo "Hele vertaling opnieuw uitvoeren, of bestaande vertaling hergebruiken?"
        read -p "Bestaande vertaling hergebruiken (alleen ontbrekende aanvullen)? [Y/n]: " ANS
        if [[ "$ANS" =~ ^[Nn]$ ]]; then
          echo ">> Volledige hervertaling..."
          task util:generate-i18n UPDATE_I18N=False
        else
          echo ">> Bestaande vertaling hergebruiken; alleen ontbrekende waarden worden aangevuld..."
          task util:generate-i18n UPDATE_I18N=True
        fi
      - task: generate:translations
      - task: publish:local
      - task: generate:lod
      - task: generate:mim
      - task: generate:diff
      - echo "Full deployment completed."
    shell: bash

  # ==========================================================================
  # Util — Hulpcommando's
  # ==========================================================================
  util:import-xlsx:
    desc: "Import an Excel file into Crunch UML Database and apply changes to the EA-repository."
    deps: [prepare:check-tools, prepare:check-vars, prepare:venv-crunch]
    cmds:
      - |
        if [ ! -f "{{.EXCEL}}" ]; then
          echo "Error: Excel file '{{.EXCEL}}' does not exist."
          exit 1
        fi
      - echo "Importing Excel file '{{.EXCEL}}' into Crunch UML..."
      - '{{.CRUNCH}} import -f "{{.EXCEL}}" -t xlsx -db_create'
      - echo "Copying Core GGM Model to {{.GGM_ROOT_SCHEMA}}..."
      - '{{.CRUNCH}} transform -ttp copy -sch_to "{{.GGM_ROOT_SCHEMA}}" -rt_pkg "{{.ROOT_GGM}}"'
      - echo "Crunch database successfully created and loaded with Excel file..."
      - echo "Loading changes into EA-repository..."
      - '{{.CRUNCH}} -sch "{{.GGM_ROOT_SCHEMA}}" export -f "{{.GGM}}" -t earepo --tag_strategy upsert'
      - echo "Data successfully loaded into repository..."
    shell: bash

  util:generate-i18n:
    desc: "Genereer vertalingen voor alle talen in LANGUAGES via de crunch_uml vertaalpijplijn (termbanken + lokale LLM's, config in .env). Zet UPDATE_I18N=False voor volledige hervertaling."
    deps: [import:model]
    vars:
      UPDATE_I18N: '{{.UPDATE_I18N | default "True"}}'
    cmds:
      - |
        if [ -z "{{.LANGUAGES}}" ]; then
          echo "Error: LANGUAGES is niet ingesteld in .env."
          exit 1
        fi

        # De backendkeuze en capability-detectie zitten in crunch_uml zelf
        # (CRUNCH_UML_* variabelen in .env; de preflight logt per run welke
        # modellen en termbanken actief zijn). Eén harde controle vooraf:
        # zonder bereikbare Ollama zou een batchrun "slagen" terwijl
        # onvertaalde bronwaarden in het i18n-bestand belanden — en die
        # worden bij volgende runs als bestaande vertaling hergebruikt.
        if ! curl -fsS --max-time 3 "${CRUNCH_UML_OLLAMA_URL:-http://localhost:11434}/api/tags" >/dev/null 2>&1; then
          echo "Error: Ollama is niet bereikbaar op ${CRUNCH_UML_OLLAMA_URL:-http://localhost:11434}."
          echo "Start de server met 'ollama serve' en probeer opnieuw."
          exit 1
        fi

        echo "Vertaalmodus: UPDATE_I18N={{.UPDATE_I18N}} (True = alleen ontbrekende, False = alles opnieuw)"

        for LANG in $(echo "{{.LANGUAGES}}" | tr ',' ' '); do
          LANG=$(echo "$LANG" | xargs)
          echo "Translating GGM to language $LANG..."
          {{.CRUNCH}} -sch "{{.GGM_ROOT_SCHEMA}}" export \
            -t i18n -f "{{.i18N_FILE}}" \
            --language "$LANG" --from_language "nl" \
            --translate True \
            --update_i18n {{.UPDATE_I18N}}

          if [ $? -ne 0 ]; then
            echo "Error: Translation for language $LANG failed."
            exit 1
          fi
          echo "Translation for language $LANG completed successfully."
        done
    env:
      LANGUAGES: "{{.LANGUAGES}}"
    sources:
      - "{{.XMI}}"
    generates:
      - "{{.i18N_FILE}}"
    shell: bash  # <-- essentieel!
